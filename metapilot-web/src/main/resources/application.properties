# MetaPilot Web Application Configuration

# Server Configuration
server.port=8080
server.address=0.0.0.0

# Application Configuration
spring.application.name=metapilot-web

# Logging Configuration
logging.level.uk.ac.quadram.metapilot=INFO
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS Configuration (for future frontend integration)
# spring.web.cors.allowed-origins=*
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
# spring.web.cors.allowed-headers=*

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

# Custom upload directory (create if doesn't exist)
upload.directory=${user.home}/metapilot/uploads

# MetaPilot CLI JAR configuration
metapilot.cli.jar.path=
# If not set, will search in: ../metapilot-windows-gui/target/, ../.., ./, ../
# Example for Linux: /opt/metapilot/metapilot-cli.jar

# Thymeleaf Configuration (if using template engine)
# spring.thymeleaf.enabled=false

