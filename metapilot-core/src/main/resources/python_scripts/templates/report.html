<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaPilot Report</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .plot-container {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .report-header {
            background-color: #f8f9fa;
            padding: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #dee2e6;
        }
        .plot-title {
            margin-bottom: 15px;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="report-header">
            <h1>{{ report.name }}</h1>
            <p class="text-muted">Generated on {{ report.timestamp }}</p>
        </div>

        {% for plot in report.plots %}
        <div class="plot-container">
            <h3 class="plot-title">{{ plot.type|title }} Plot</h3>
            <div id="plot-{{ loop.index }}" style="width:100%; height:500px;"></div>
        </div>
        {% endfor %}
    </div>

    <script>
        // Load and display plots
        {% for plot in report.plots %}
        fetch('{{ plot.path }}')
            .then(response => response.text())
            .then(html => {
                const plotDiv = document.getElementById('plot-{{ loop.index }}');
                plotDiv.innerHTML = html;
            })
            .catch(error => console.error('Error loading plot:', error));
        {% endfor %}
    </script>
</body>
</html>
